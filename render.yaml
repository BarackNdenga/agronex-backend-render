services:
  - type: web
    name: agronex-api
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm build
    startCommand: node dist/index.js
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DRIZZLE_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: OAUTH_SERVER_URL
        sync: false
      - key: AGRONEX_PUBLIC_BASE_URL
        sync: false
      - key: AGRONEX_OWNER_OPEN_ID
        sync: false
      - key: AGRONEX_ADMIN_EMAILS
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: TIKTOK_OAUTH_CLIENT_KEY
        sync: false
      - key: TIKTOK_OAUTH_CLIENT_SECRET
        sync: false
